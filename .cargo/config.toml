# Windows: link the C runtime statically (exe and llama.cpp DLLs), so users
# don't need the Visual C++ Redistributable installed.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
LLAMA_STATIC_CRT = "1"
# ts-rs writes the TypeScript types shared with the UI here (`cargo test export_bindings`).
TS_RS_EXPORT_DIR = { value = "app/src/lib/bindings", relative = true }
