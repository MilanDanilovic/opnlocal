# cargo-about: third-party notices for every Rust crate that ships in the app, per platform.
# Generate with scripts/generate-notices.sh. A crate with a license outside this list fails the
# run, which is how new copyleft dependencies get caught (see docs/RELEASING.md).
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "BSL-1.0",
  "0BSD",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-linux-android",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Our own crates (publish = false) are opnlocal itself (Apache-2.0, see LICENSE), not third-party.
[private]
ignore = true
